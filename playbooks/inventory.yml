---
all:
  children:
    xike_switches:
      hosts:
        sw1:
          ansible_host: 10.1.0.20
          ansible_user: admin
          ansible_password: "{{ lookup('env', 'XIKEOS_PASSWORD') }}"
          ansible_connection: ansible.netcommon.network_cli
          ansible_network_os: c1emon.xikeos.xikeos
          ansible_become: true
          ansible_become_method: enable
          ansible_become_password: >-
            {{ lookup('env', 'XIKEOS_ENABLE_PASSWORD') | default(lookup('env', 'XIKEOS_PASSWORD'), true) }}
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
