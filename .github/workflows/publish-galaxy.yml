name: Publish collection to Galaxy

on:
  release:
    types: [published]

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish:
    name: Build and publish collection
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify release tag matches galaxy.yml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          galaxy_version="$(python3 - <<'PY'
          from pathlib import Path

          for line in Path('galaxy.yml').read_text().splitlines():
              if line.startswith('version:'):
                  print(line.split(':', 1)[1].strip().strip('"\''))
                  break
          else:
              raise SystemExit('galaxy.yml version not found')
          PY
          )"
          if [ "$tag_version" != "$galaxy_version" ]; then
            echo "Release tag version '$tag_version' does not match galaxy.yml version '$galaxy_version'."
            exit 1
          fi
          echo "galaxy_version=$galaxy_version" >> "$GITHUB_ENV"

      - name: Reject an already-published Galaxy version
        run: |
          version_url="https://galaxy.ansible.com/api/v3/plugin/ansible/content/published/collections/index/c1emon/xikeos/versions/${galaxy_version}/"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$version_url")"
          case "$status" in
            404) ;;
            200)
              echo "Galaxy version ${galaxy_version} is already published. Bump galaxy.yml before release."
              exit 1
              ;;
            *)
              echo "Could not verify Galaxy version availability (HTTP ${status}); refusing to publish."
              exit 1
              ;;
          esac

      - name: Install Ansible collection dependencies
        run: .venv/bin/ansible-galaxy collection install 'ansible.netcommon:>=5.0.0' -p .ansible/collections

      - name: Run unit tests
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
        run: .venv/bin/python -m pytest tests/unit

      - name: Build collection
        run: .venv/bin/ansible-galaxy collection build --force

      - name: Verify built tarball matches galaxy.yml version
        run: |
          tarball="c1emon-xikeos-${galaxy_version}.tar.gz"
          if [ ! -f "$tarball" ]; then
            echo "Expected tarball '$tarball' is missing after build."
            ls -1 c1emon-xikeos-*.tar.gz || true
            exit 1
          fi

      - name: Publish collection to Galaxy
        run: |
          tarball="c1emon-xikeos-${galaxy_version}.tar.gz"
          .venv/bin/ansible-galaxy collection publish "$tarball" --api-key "${{ secrets.ANSIBLE_GALAXY_API_KEY }}"
