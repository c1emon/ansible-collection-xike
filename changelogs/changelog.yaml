ancestor: null
releases:
  0.2.2:
    changes:
      release_summary: Complete evidence-gated reconciliation safety migration.
      major_changes:
        - Static routes and positional ACLs now use sealed shared reconciliation plans, including ordered-rule replacement.
        - Release automation rejects a Galaxy version that is already published before upload.
  0.2.1:
    changes:
      release_summary: Harden resource reconciliation, mutation safety, and validation gates.
      major_changes:
        - Resource modules now use sealed plans and preserve unlisted resources for replaced operations.
        - Omitted optional values are no-ops; unsupported reset, MTU, IPv6 route mutation, and unproven ACL syntax fail closed.
        - The collection validates Python 3.12-3.14 with ansible-core 2.20-2.21 before publication.
  0.2.0:
    changes:
      release_summary: Mature XikeOS collection platform capabilities.
  0.1.0:
    changes:
      release_summary: Initial Xike OS collection release.
