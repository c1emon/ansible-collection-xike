namespace: c1emon
name: xikeos
version: 0.2.2
readme: README.md
description: Ansible Collection for Xike (兮克) switches - Cisco IOS-like CLI
authors:
  - clemon
license:
  - MIT
dependencies:
  ansible.netcommon: ">=5.0.0"
repository: https://github.com/c1emon/ansible-collection-xike
documentation: https://github.com/c1emon/ansible-collection-xike
homepage: https://github.com/c1emon/ansible-collection-xike
issues: https://github.com/c1emon/ansible-collection-xike/issues
