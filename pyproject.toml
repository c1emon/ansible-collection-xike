[project]
name = "xike-xikeos"
version = "0.1.0"
description = "Ansible Collection for Xike switches using network_cli"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ansible-core>=2.15.0",
]

[dependency-groups]
dev = [
    "ansible-lint>=26.4.0",
    "pytest>=9.0.3",
]

[project.optional-dependencies]
netmiko-reference = [
    "netmiko>=4.7.0",
]
