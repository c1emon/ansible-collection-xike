[project]
name = "xike-xikeos"
version = "0.1.0"
description = "Ansible Collection for Xike switches using network_cli"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "ansible-core>=2.20.0,<2.22.0",
    "textfsm>=1.1.3",
    "ttp>=0.9.5",
]

[dependency-groups]
dev = [
    "ansible-lint>=26.4.0",
    "pytest>=7.0.0",
    "ruff>=0.16.4",
]

[project.optional-dependencies]
netmiko-reference = [
    "netmiko>=4.7.0",
]

[tool.ruff.lint]
ignore = ["E402"]
